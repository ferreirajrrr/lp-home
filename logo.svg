<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Dark Background -->
    <rect id="bg" width="800" height="800" fill="#090d14"/>
    
    <!-- Emerald Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Text Glow -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradient for Accent Line -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090d14" stop-opacity="0"/>
      <stop offset="25%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#090d14" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow for A Icon -->
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle corner texture -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f2a20" stop-opacity="1"/>
      <stop offset="100%" stop-color="#090d14" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGlow)"/>
  
  <!-- Subtle corner glows -->
  <circle cx="100" cy="100" r="200" fill="#10b981" opacity="0.04"/>
  <circle cx="700" cy="700" r="180" fill="#06b6d4" opacity="0.04"/>

  <!-- ICON: Minimalist "A" Geometric Mark -->
  <g transform="translate(310, 145)">
    <!-- Icon background pill -->
    <rect x="-10" y="-10" width="180" height="130" rx="20" fill="#10b981" opacity="0.06"/>
    
    <!-- Geometric A mark: two angled strokes + crossbar -->
    <polygon points="80,10 145,120 118,120 80,50 42,120 15,120" 
             fill="none" stroke="#10b981" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"
             filter="url(#emeraldGlow)"/>
    <!-- Crossbar of A -->
    <line x1="32" y1="88" x2="128" y2="88" stroke="#10b981" stroke-width="7" stroke-linecap="round"
          filter="url(#softGlow)"/>
    
    <!-- Inner accent dot -->
    <circle cx="80" cy="88" r="3.5" fill="#06b6d4" opacity="0.9"/>
  </g>

  <!-- Accent Line Top -->
  <rect x="160" y="285" width="480" height="1.5" rx="1" fill="url(#accentLine)"/>

  <!-- AURA Wordmark -->
  <text x="400" y="385" 
        font-family="'Helvetica Neue', 'Arial', sans-serif" 
        font-weight="900" 
        font-size="110" 
        fill="#f8fafc"
        text-anchor="middle" 
        letter-spacing="28"
        filter="url(#softGlow)">AURA</text>

  <!-- Accent Line Bottom -->
  <rect x="160" y="405" width="480" height="1.5" rx="1" fill="url(#accentLine)"/>

  <!-- Digital Studio Subtitle -->
  <text x="400" y="455" 
        font-family="'Helvetica Neue', 'Arial', sans-serif" 
        font-weight="300" 
        font-size="28" 
        fill="#94a3b8"
        text-anchor="middle" 
        letter-spacing="14">DIGITAL STUDIO</text>

  <!-- Emerald Accent Dot Between Words -->
  <circle cx="400" cy="488" r="3" fill="#10b981" opacity="0.7" filter="url(#softGlow)"/>

  <!-- Tagline -->
  <text x="400" y="530" 
        font-family="'Helvetica Neue', 'Arial', sans-serif" 
        font-weight="400" 
        font-size="16" 
        fill="#64748b"
        text-anchor="middle" 
        letter-spacing="5">WEB DESIGN · LANDING PAGES · CONVERSÃO</text>

  <!-- Bottom accent dots row -->
  <g opacity="0.5">
    <circle cx="320" cy="570" r="2.5" fill="#10b981"/>
    <circle cx="340" cy="570" r="2.5" fill="#10b981" opacity="0.5"/>
    <circle cx="360" cy="570" r="2.5" fill="#06b6d4" opacity="0.3"/>
  </g>
  <g opacity="0.5" transform="scale(-1,1) translate(-800,0)">
    <circle cx="320" cy="570" r="2.5" fill="#10b981"/>
    <circle cx="340" cy="570" r="2.5" fill="#10b981" opacity="0.5"/>
    <circle cx="360" cy="570" r="2.5" fill="#06b6d4" opacity="0.3"/>
  </g>
</svg>
