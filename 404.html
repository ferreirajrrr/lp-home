        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .error-content {
            max-width: 560px;
        }

        .error-code {
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: clamp(5rem, 18vw, 9rem);
            line-height: 1;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0 0 0.5rem;
        }

        .error-logo {
            margin-bottom: 1.5rem;
            display: inline-flex;
        }

        .error-title {
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            color: var(--text-primary);
            margin: 0 0 0.75rem;
        }

        .error-desc {
            color: var(--text-muted);
            font-size: 1.02rem;
            line-height: 1.6;
            margin: 0 0 2.2rem;
        }

        .error-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
            justify-content: center;
        }
    </style>
</head>

<body>

    <!-- Background Glows -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-glow bg-glow-3"></div>

    <main class="error-page">
        <div class="error-content">
            <a href="index.html" class="error-logo" aria-label="AURA Digital Studio">
